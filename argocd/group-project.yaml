apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: tenant-groups
  namespace: argocd
spec:
  description: Group charts directly managing tenant service and umbrella configuration
  sourceRepos:
  - git@github.com:tanish120704/helm-values-poc.git
  - git@github.com:tanish120704/argocd-gitops-poc.git
  destinations:
  - server: https://kubernetes.default.svc
    namespace: tenant-*
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
  namespaceResourceWhitelist:
  - group: ''
    kind: ConfigMap
