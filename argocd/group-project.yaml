apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: tenant-groups
  namespace: argocd
spec:
  description: Platform-owned groups managing service Applications and Foundation configuration
  sourceRepos:
    - git@github.com:tanish120704/helm-values-poc.git
    - git@github.com:tanish120704/argocd-gitops-poc.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: tenant-*
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: Application
    - group: ''
      kind: ConfigMap
