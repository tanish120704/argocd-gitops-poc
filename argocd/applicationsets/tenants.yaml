apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenants
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: git@github.com:tanish120704/argocd-gitops-poc.git
        revision: main
        requeueAfterSeconds: 30
        files:
          - path: tenants/*/values.yaml
  template:
    metadata:
      name: 'tenant-{{ .path.basename }}'
    spec:
      project: tenants
      sources:
        - repoURL: git@github.com:tanish120704/helm-values-poc.git
          targetRevision: main
          path: .
          helm:
            releaseName: '{{ .path.basename }}'
            valueFiles:
              - '$values/{{ .path.path }}/values.yaml'
        - repoURL: git@github.com:tanish120704/argocd-gitops-poc.git
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: 'tenant-{{ .path.basename }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
