apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: umbrella-tenant
  namespace: argocd
spec:
  destination:
    namespace: tenant-umbrella-tenant
    server: https://kubernetes.default.svc
  project: tenants
  source:
    helm:
      releaseName: umbrella-tenant
      valuesObject:
        global:
          tenant:
            domain: umbrella-tenant.example.com
            id: umbrella-tenant
            name: umbrella-tenant
    path: .
    repoURL: git@github.com:tanish120704/helm-values-poc.git
    targetRevision: refs/heads/main
  syncPolicy:
    automated:
      allowEmpty: false
      prune: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
