apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: umbrella-tenant
  namespace: argocd
spec:
  project: tenant-parents
  source:
    repoURL: git@github.com:tanish120704/argocd-gitops-poc.git
    targetRevision: refs/heads/main
    path: applications/tenant-parent
    helm:
      valuesObject:
        tenantId: umbrella-tenant
        tenantValuesPath: legacy-tenants/umbrella-tenant/values.yaml
        groupPrune: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
      allowEmpty: false
