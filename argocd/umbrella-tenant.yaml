apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: umbrella-tenant
  namespace: argocd
spec:
  project: tenants
  source:
    repoURL: git@github.com:tanish120704/helm-values-poc.git
    targetRevision: refs/heads/main
    path: .
    helm:
      releaseName: umbrella-tenant
      valuesObject:
        global:
          tenant:
            name: umbrella-tenant
            id: umbrella-tenant
            domain: umbrella-tenant.example.com
  destination:
    server: https://kubernetes.default.svc
    namespace: tenant-umbrella-tenant
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
