apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  resource.customizations.health.argoproj.io_Application: |
    -- Avoid a circular health dependency in the self-managing control-plane app.
    if obj.metadata.name == "argocd" then
      return { status = "Healthy", message = "Self-managed control plane" }
    end
    local hs = { status = "Progressing", message = "Waiting for child sync and health" }
    if obj.status ~= nil then
      if obj.status.health ~= nil and obj.status.health.status == "Degraded" then
        return obj.status.health
      end
      if obj.status.sync ~= nil and obj.status.sync.status == "Synced" and obj.status.health ~= nil then
        return obj.status.health
      end
    end
    return hs
