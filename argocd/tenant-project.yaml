apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: tenants
  namespace: argocd
spec:
  description: Tenant ConfigMap POC in dedicated tenant namespaces
  sourceRepos:
    - git@github.com:tanish120704/helm-values-poc.git
    - git@github.com:tanish120704/argocd-gitops-poc.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: tenant-*
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ''
      kind: ConfigMap
