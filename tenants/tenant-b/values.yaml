# Sparse exceptions: 10 services customized; 40 inherit parent/subchart defaults.
# Includes false, zero, empty-list, replacement-list, and partial nested-map cases.
global:
  tenant:
    name: tenant-b
    domain: tenant-b.example.com
    id: tenant-b
    region: eu-west
    tier: enterprise
    locale: en-GB
    timezone: Europe/London
platform:
  supportEmail: support@tenant-b.example.com
  featureEnabled: true
  displayName: Tenant B Enterprise
  sessionTimeoutSeconds: 3600
  branding:
    theme: dark
    primaryColor: '#cc3300'
service-a:
  message: Custom message for tenant B
  settings:
    logLevel: trace
  runtime:
    replicas: 3
    image:
      tag: 2.1.0
  resources:
    limits:
      memory: 1Gi
  features:
    cacheEnabled: false
    searchEnabled: true
  retry:
    maxAttempts: 0
  tenantConfig:
    displayName: Tenant B workspace
    quota:
      maxUsers: 2000
    tags:
    - enterprise
    - pilot
service-b:
  settings:
    logLevel: debug
    environment: staging
    allowedOrigins: []
  runtime:
    workers: 8
  integrations:
    webhook:
      enabled: true
      url: https://tenant-b.example.com/hooks
routing:
  basePath: /tenant-b
  cors:
    allowedOrigins:
    - https://tenant-b.example.com
  rateLimit:
    requestsPerMinute: 5000
notifications:
  senderName: Tenant B
  senderEmail: notify@tenant-b.example.com
  channels:
  - email
  - webhook
  digest:
    enabled: false
observability:
  logLevel: debug
  tracing:
    enabled: true
    sampleRate: 0.5
  labels:
    team: tenant-b
security:
  passwordPolicy:
    requireMfa: true
  audit:
    retentionDays: 365
  allowedCidrs:
  - 192.168.0.0/16
integrations:
  webhooks:
    enabled: true
    events: []
  exports:
    format: csv
    batchSize: 1000
service-03:
  settings:
    logLevel: warn
    timeoutSeconds: 93
  runtime:
    replicas: 3
  resources:
    requests:
      cpu: 250m
  features:
    betaEnabled: true
  tenantConfig:
    quota:
      maxProjects: 103
    tags:
    - tenant-b
