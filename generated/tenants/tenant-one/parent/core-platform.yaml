apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tenant-one-core-platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '1'
  labels:
    platform.example.com/tenant: tenant-one
    platform.example.com/group: core-platform
spec:
  project: tenants
  source:
    repoURL: git@github.com:tanish120704/argocd-gitops-poc.git
    targetRevision: refs/heads/main
    path: generated/artifacts/tenant-one/core-platform/bdb1a6d7bf95f3b4fb98e4bea5822fcc09054def356df6cbfd164ebd72a72a6c
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: tenant-tenant-one
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
