apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tenant-b-to-revisit
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '3'
  labels:
    platform.example.com/tenant: tenant-b
    platform.example.com/group: to-revisit
spec:
  project: tenants
  source:
    repoURL: git@github.com:tanish120704/argocd-gitops-poc.git
    targetRevision: refs/heads/main
    path: generated/artifacts/tenant-b/to-revisit/4f6b2491b5153ea583349d7ff90c140ecc660a2672f640f2b582f666b116c90b
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: tenant-tenant-b
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
