apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tenant-b-foundation
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '0'
  labels:
    platform.example.com/tenant: tenant-b
    platform.example.com/group: foundation
spec:
  project: tenants
  source:
    repoURL: git@github.com:tanish120704/argocd-gitops-poc.git
    targetRevision: refs/heads/main
    path: generated/artifacts/tenant-b/foundation/6bf12ad55d710bebc2d8768aa85c258efebdd12f9255fc339efee77f79206b24
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: tenant-tenant-b
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
