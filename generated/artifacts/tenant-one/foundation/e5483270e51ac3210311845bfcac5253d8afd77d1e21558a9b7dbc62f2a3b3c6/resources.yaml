  name: tenant-one-service-11
  labels:
    poc.example.com/role: service
    poc.example.com/service: service-11
data:
  message: service-11 configured by parent chart
  environment: poc
  logLevel: debug
  tenantName: tenant-one
  tenantDomain: tenant-one.example.com
  config.json: "{\n  \"features\": {\n    \"betaEnabled\": false,\n    \"cacheEnabled\"\
    : true,\n    \"searchEnabled\": false\n  },\n  \"integrations\": {\n    \"export\"\
    : {\n      \"enabled\": true,\n      \"format\": \"json\"\n    },\n    \"webhook\"\
    : {\n      \"enabled\": false,\n      \"url\": \"https://hooks.example.com/default\"\
    \n    }\n  },\n  \"message\": \"service-11 configured by parent chart\",\n  \"\
    resources\": {\n    \"limits\": {\n      \"cpu\": \"500m\",\n      \"memory\"\
    : \"256Mi\"\n    },\n    \"requests\": {\n      \"cpu\": \"100m\",\n      \"memory\"\
    : \"128Mi\"\n    }\n  },\n  \"retry\": {\n    \"backoffSeconds\": 2,\n    \"maxAttempts\"\
    : 3\n  },\n  \"runtime\": {\n    \"health\": {\n      \"intervalSeconds\": 10,\n\
    \      \"path\": \"/healthz\"\n    },\n    \"image\": {\n      \"repository\"\
    : \"example/service-11\",\n      \"tag\": \"1.0.0\"\n    },\n    \"replicas\"\
    : 2,\n    \"workers\": 4\n  },\n  \"settings\": {\n    \"allowedOrigins\": [\n\
    \      \"https://default.example.com\"\n    ],\n    \"environment\": \"poc\",\n\
    \    \"logLevel\": \"debug\",\n    \"port\": 8011,\n    \"timeoutSeconds\": 41\n\
    \  },\n  \"tenant\": {\n    \"domain\": \"tenant-one.example.com\",\n    \"id\"\
    : \"tenant-one\",\n    \"locale\": \"en-IN\",\n    \"name\": \"tenant-one\",\n\
    \    \"region\": \"local\",\n    \"tier\": \"standard\",\n    \"timezone\": \"\
    Asia/Kolkata\"\n  },\n  \"tenantConfig\": {\n    \"displayName\": \"Default workspace\"\
    ,\n    \"quota\": {\n      \"maxProjects\": 50,\n      \"maxUsers\": 500\n   \
    \ },\n    \"tags\": [\n      \"shared\",\n      \"poc\"\n    ]\n  }\n}\n"
